name: Sync Alpha and Beta branches

on:
  push:
    branches:
      - v2

jobs:
  sync-branches:
    name: Create sync PRs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ['alpha', 'v2-develop']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ matrix.target }}

      - name: Create sync PRs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          sync_branch="sync/v2-to-${{ matrix.target }}/$(date +%Y%m%d-%H%M%S)"
          git checkout -b $sync_branch

          # Fetch v2 branch
          git fetch origin v2

          # Try to merge, if conflicts occur resolve using v2 (ours)
          if ! git merge origin/v2 --no-edit; then
            git merge --abort
            git merge origin/v2 -X ours --no-edit
            echo "CONFLICTS=true" >> $GITHUB_ENV
          fi

          # Force add all changes
          git add -A

          # Create commit even if there are no changes
          git commit -m "Sync changes from v2 to ${{ matrix.target }}" || echo "No changes to commit"

          # Push with force to ensure branch is updated
          git push -f origin $sync_branch
          echo "SYNC_BRANCH=$sync_branch" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          base: ${{ matrix.target }}
          title: "chore: sync changes from v2 to ${{ matrix.target }}${{ env.CONFLICTS == 'true' && ' (conflicts resolved using v2)' || '' }}"
          body: |
            This PR syncs changes from the v2 branch to ${{ matrix.target }}.
            ${{ env.CONFLICTS == 'true' && '⚠️ There were conflicts that were automatically resolved using changes from v2.' || '' }}

            This is an automated PR created by GitHub Actions.
          labels: automated-pr
          branch: ${{ env.SYNC_BRANCH }}

