name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clone webclient-workflow-plugin and copy SKILL.md to CLAUDE.md
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/gisce/webclient-workflow-plugin.git /tmp/webclient-workflow-plugin
          cp /tmp/webclient-workflow-plugin/webclient-workflow/skills/webclient-workflow/SKILL.md ./CLAUDE.md

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}  # Custom PAT for cross-repo access
          # Use Opus (extended thinking is enabled by default for Opus 4.5)
          # Allow specific gh commands and git commands for cross-repo work
          claude_args: '--model claude-opus-4-5-20251101 --allowed-tools "Bash(gh repo view:*),Bash(gh repo clone:*),Bash(gh api repos/:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh search:*),Bash(git clone:*),Bash(git -C:*),Bash(git checkout:*),Bash(git branch:*),Bash(git fetch:*),Bash(git pull:*),Bash(git remote:*),Bash(npm:*),Bash(cd:*),WebFetch,WebSearch"'
