name: Build Check on PR

on:
  pull_request:
    branches:
      - v2
      - v2-develop
      - alpha

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.5.0'

    - name: Install dependencies
      run: npm install

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.5.0'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Install e2e dependencies
      run: |
        cd e2e-test-app
        npm install

    - name: Install Playwright
      run: |
        cd e2e-test-app
        npx playwright install --with-deps

    - name: Run e2e tests
      run: |
        cd e2e-test-app
        npm run test:ci -- --shard=${{ matrix.shard }}