name: Build Check on PR

on:
  pull_request:
    branches:
      - v2
      - v2-develop
      - alpha

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.12.0"

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run e2e tests
        run: |
          cd e2e-test-app
          npm install
          npx playwright install
          npm test
